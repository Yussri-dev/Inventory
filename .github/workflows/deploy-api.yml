name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "dotNetApiProBoilerplate.Api/**"
      - "dotNetApiProBoilerplate.Domain/**"
      - "dotNetApiProBoilerplate.Dto/**"
      - "dotNetApiProBoilerplate.Infrastructure/**"
      - "dotNetApiProBoilerplate.Services/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build EF migration bundle
        run: |
          dotnet ef migrations bundle \
            --context InventoryDbContext \
            --project dotNetApiProBoilerplate.Infrastructure/Inventory.Infrastructure.csproj \
            --startup-project dotNetApiProBoilerplate.Api/Inventory.Api.csproj \
            --self-contained \
            --target-runtime linux-x64 \
            --output efbundle

      - name: Restore SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add VPS to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload EF migration bundle
        shell: bash
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            efbundle \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/ventepilote/efbundle"

      - name: Make EF bundle executable
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod +x /opt/ventepilote/efbundle"

      - name: Deploy API on VPS
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e

            cd /opt/ventepilote/app
            git pull --ff-only origin main

            cd /opt/ventepilote
            ./backup-postgres.sh

            cd /opt/ventepilote/app
            docker build -t ventepilote-api:prod .

            cd /opt/ventepilote
            docker compose up -d api

            sleep 10

            curl --fail --silent --show-error \
              https://api.ventepilote.com/support/index.html \
              > /dev/null
          EOF